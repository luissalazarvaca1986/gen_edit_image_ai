services:
  postgres:
    image: postgres:16
    container_name: gen-ai-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      gen-ai-net:
        ipv4_address: 192.168.89.13

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: gen-ai-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      - DATABASE_URL=postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${DB_NAME}
      - MODELS_DIR=/models
      - IMAGES_DIR=/images
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./models:/models:ro
      - ./images:/images:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      gen-ai-net:
        ipv4_address: 192.168.89.11

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: gen-ai-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3010}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      gen-ai-net:
        ipv4_address: 192.168.89.12

volumes:
  postgres_data:
    name: gen-ai-postgres-data

networks:
  gen-ai-net:
    name: gen-ai-net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.89.0/24
          gateway: 192.168.89.1
